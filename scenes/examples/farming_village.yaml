# 仿真实社会农林环境 - 场景描述 (YAML 格式)
# 由 build_scene.py 读取后生成 UE5 umap 关卡
# 放置模式: single(单资产 transform) / grid(网格批量, 含 jitter 模拟自然分布)

scene:
  name: FarmingVillage
  target_level: /Game/MapForgeTest/GB_FarmingVillage
  description: 仿真实社会农林环境(模块农舍+麦田+防护林+野花+围栏+光照天气)

# 草地地面 (FloorPlane 放大 15 倍, 30m x 30m)
ground:
  asset: /Game/RuralHouse/House/Meshes/ModularParts/SM_House_FloorPlane_03
  location: [0, 0, 0]
  scale: [15, 15, 1]

placements:
  # ========== 农舍 (3m x 3m 模块组装, 中心原点) ==========
  # 地基
  - asset: /Game/RuralHouse/House/Meshes/ModularParts/SM_House_Base_300CM
    location: [0, 0, 0]
  # 前墙(带门)
  - asset: /Game/RuralHouse/House/Meshes/ModularParts/SM_House_ExtWall_Door_A
    location: [0, 150, 0]
    rotation: [0, 0, 0]
  # 后墙
  - asset: /Game/RuralHouse/House/Meshes/ModularParts/SM_House_ExtWall_300CM
    location: [0, -150, 0]
    rotation: [0, 180, 0]
  # 左墙
  - asset: /Game/RuralHouse/House/Meshes/ModularParts/SM_House_ExtWall_300CM
    location: [-150, 0, 0]
    rotation: [0, 90, 0]
  # 右墙
  - asset: /Game/RuralHouse/House/Meshes/ModularParts/SM_House_ExtWall_300CM
    location: [150, 0, 0]
    rotation: [0, -90, 0]
  # 4 个墙角
  - asset: /Game/RuralHouse/House/Meshes/ModularParts/SM_House_ExtWall_Corner_A
    location: [150, 150, 0]
  - asset: /Game/RuralHouse/House/Meshes/ModularParts/SM_House_ExtWall_Corner_A
    location: [-150, 150, 0]
    rotation: [0, 90, 0]
  - asset: /Game/RuralHouse/House/Meshes/ModularParts/SM_House_ExtWall_Corner_A
    location: [-150, -150, 0]
    rotation: [0, 180, 0]
  - asset: /Game/RuralHouse/House/Meshes/ModularParts/SM_House_ExtWall_Corner_A
    location: [150, -150, 0]
    rotation: [0, -90, 0]
  # 屋顶
  - asset: /Game/RuralHouse/House/Meshes/ModularParts/SM_House_FrontEntranceRoof_A
    location: [0, 0, 300]
  # 侧窗
  - asset: /Game/RuralHouse/House/Meshes/ModularParts/SM_House_ExtWall_Window_A
    location: [150, 0, 150]
    rotation: [0, -90, 0]
  - asset: /Game/RuralHouse/House/Meshes/ModularParts/SM_House_ExtWall_Window_A
    location: [-150, 0, 150]
    rotation: [0, 90, 0]

  # ========== 麦田 (北侧, 草网格模拟麦穗, 14x10 = 140 株) ==========
  - asset: /Game/RuralHouse/Environment/Foliage/SM_Grass_01
    grid:
      rows: 10
      cols: 14
      origin: [-600, 600, 0]
      spacing: [85, 85, 0]
      jitter: 25
  # 枯草点缀 (麦田边缘, 自然感)
  - asset: /Game/Foliage_Sets/VOL22_WildGrass/Meshes/SM_Dead_Plants_01a
    grid:
      rows: 4
      cols: 6
      origin: [-500, 500, 0]
      spacing: [200, 200, 0]
      jitter: 60

  # ========== 防护林 (南侧边缘, 松树两排) ==========
  - asset: /Game/Modular_Rural_Cabin/Meshes/Foliage/SM_Pine_Tree_01
    grid:
      rows: 1
      cols: 10
      origin: [-1350, -800, 0]
      spacing: [300, 0, 0]
      jitter: 50
  - asset: /Game/Modular_Rural_Cabin/Meshes/Foliage/SM_Pine_Tree_03
    grid:
      rows: 1
      cols: 8
      origin: [-1100, -1100, 0]
      spacing: [315, 0, 0]
      jitter: 70

  # ========== 野花野草散布 (模拟荒地野植被) ==========
  # 蒲公英
  - asset: /Game/RuralHouse/Environment/Foliage/SM_Dandelion_A
    grid:
      rows: 6
      cols: 6
      origin: [500, -200, 0]
      spacing: [130, 130, 0]
      jitter: 50
  # 蕨类
  - asset: /Game/RuralHouse/Environment/Foliage/SM_Fern_01
    grid:
      rows: 4
      cols: 5
      origin: [-900, 300, 0]
      spacing: [160, 160, 0]
      jitter: 55
  # 灌木丛
  - asset: /Game/RuralHouse/Environment/Foliage/SM_Shrub_A_01
    grid:
      rows: 3
      cols: 4
      origin: [700, 700, 0]
      spacing: [220, 220, 0]
      jitter: 70
  # 草丛
  - asset: /Game/RuralHouse/Environment/Foliage/SM_Grass_02
    grid:
      rows: 8
      cols: 8
      origin: [-1000, -300, 0]
      spacing: [110, 110, 0]
      jitter: 45

  # ========== 围栏 (农舍院子四周) ==========
  # 前围栏
  - asset: /Game/RuralHouse/House/Meshes/Fence/SM_Fence_A
    grid:
      rows: 1
      cols: 8
      origin: [-1050, 450, 0]
      spacing: [300, 0, 0]
  # 后围栏
  - asset: /Game/RuralHouse/House/Meshes/Fence/SM_Fence_A
    grid:
      rows: 1
      cols: 8
      origin: [-1050, -450, 0]
      spacing: [300, 0, 0]
      rotation: [0, 180, 0]
  # 左围栏
  - asset: /Game/RuralHouse/House/Meshes/Fence/SM_Fence_A
    grid:
      rows: 4
      cols: 1
      origin: [-1050, -450, 0]
      spacing: [0, 300, 0]
      rotation: [0, 90, 0]
  # 右围栏
  - asset: /Game/RuralHouse/House/Meshes/Fence/SM_Fence_A
    grid:
      rows: 4
      cols: 1
      origin: [1050, -450, 0]
      spacing: [0, 300, 0]
      rotation: [0, -90, 0]

# ========== 光照系统 (修复全黑问题: 显式设置强度和颜色) ==========
lighting:
  # 太阳光 (定向光)
  directional_light:
    location: [0, 0, 3000]
    rotation: [-45, 35, 0]      # 俯角45度, 偏东南方向 (午后阳光)
    intensity: 10.0              # lux, UE5 太阳光标准值
    color: [1.0, 0.93, 0.76]    # 暖色调阳光 (RGB 线性值)
    cast_shadows: true
  # 天空光 (环境光)
  sky_light:
    location: [0, 0, 3000]
    intensity: 3.0               # 环境光强度
    color: [0.75, 0.85, 1.0]   # 天空蓝
  # 大气层 (天空渲染, 必须在 SkyLight 之前放置)
  sky_atmosphere:
    location: [0, 0, 0]
  # 高度雾 (大气透视感)
  height_fog:
    location: [0, 0, 0]
    density: 0.02               # 雾密度 (低值=轻微薄雾)
    color: [0.7, 0.8, 0.9]     # 淡蓝色雾

# ========== 天气系统 ==========
weather:
  # 体积云 (UE5 云层渲染)
  volumetric_clouds:
    location: [0, 0, 2000]
  # 后期处理 (曝光控制, 防止自动曝光导致画面过暗)
  post_process:
    auto_exposure_min: 1.0      # 最小曝光 (锁定, 防止变暗)
    auto_exposure_max: 1.0      # 最大曝光 (与最小相同=固定曝光)
